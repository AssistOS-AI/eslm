<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specification Matrix — ESLM Documentation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div data-include="partials/header.html"></div>
  <main class="page">
    <div class="page__panel loader-frame">
      <div class="loader-heading">
        <small>
          <a href="index.html">Home</a> |
          <a href="specsLoader.html?spec=matrix.md">Specs</a> |
          <span id="current-spec">Loading...</span>
        </small>
        <div>
          <p class="kicker">Specification Viewer</p>
          <h1 id="spec-title">Specification Matrix</h1>
        </div>
      </div>

      <div id="spec-meta"></div>
      <details id="spec-toc" class="spec-toc" hidden>
        <summary id="spec-toc-title">On this page</summary>
        <nav aria-labelledby="spec-toc-title"><ol id="spec-toc-list"></ol></nav>
      </details>
      <div id="content" class="content">
        <div class="loading">Loading specification...</div>
      </div>
      <nav id="spec-navigation" class="spec-navigation" aria-label="Adjacent specifications" hidden></nav>
    </div>
  </main>
  <div data-include="partials/footer.html"></div>

  <script>
    class SpecsLoader {
      constructor() {
        this.content = document.getElementById('content');
        this.currentSpecSpan = document.getElementById('current-spec');
        this.specTitle = document.getElementById('spec-title');
        this.specMeta = document.getElementById('spec-meta');
        this.specToc = document.getElementById('spec-toc');
        this.specTocList = document.getElementById('spec-toc-list');
        this.specNavigation = document.getElementById('spec-navigation');
        this.specPath = this.getSpecPath();
        this.load();
      }

      getSpecPath() {
        const params = new URLSearchParams(window.location.search);
        return params.get('spec');
      }

      specResourcePath(specPath) {
        return `specs/${encodeURIComponent(specPath)}`;
      }

      parseFrontmatter(markdown) {
        if (!markdown.startsWith('---\n')) {
          return { metadata: {}, body: markdown };
        }

        const endIndex = markdown.indexOf('\n---\n', 4);
        if (endIndex === -1) {
          return { metadata: {}, body: markdown };
        }

        const metadata = {};
        for (const line of markdown.slice(4, endIndex).trim().split('\n')) {
          const match = line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);
          if (match) {
            metadata[match[1]] = match[2];
          }
        }

        return {
          metadata,
          body: markdown.slice(endIndex + 5)
        };
      }

      async load() {
        if (!this.specPath) {
          window.location.href = 'specsLoader.html?spec=matrix.md';
          return;
        }

        try {
          if (!/^(?:matrix|DS\d{3}-[A-Za-z0-9-]+)\.md$/u.test(this.specPath)) {
            throw new Error('Invalid specification path. Open a DS file from the specification matrix.');
          }
          this.currentSpecSpan.textContent = `Loading: ${this.specPath}`;
          const response = await fetch(this.specResourcePath(this.specPath));
          if (!response.ok) {
            throw new Error(
              `Specification source is unavailable: ${this.specPath}. `
              + 'The published site must preserve the raw docs/specs Markdown files.'
            );
          }

          const markdown = await response.text();
          const { metadata, body } = this.parseFrontmatter(markdown);
          const title = metadata.title || body.match(/^#\s+(.+)$/m)?.[1] || this.specPath;
          const rendered = this.markdownToHtml(this.removeLeadingHeading(body));

          this.content.innerHTML = rendered.html;
          this.renderMetadata(metadata);
          this.renderTableOfContents(rendered.headings);
          this.currentSpecSpan.textContent = metadata.id ?? (this.specPath === 'matrix.md' ? 'Matrix' : this.specPath);
          this.currentSpecSpan.title = this.specPath;
          this.specTitle.textContent = title;
          document.title = `${title} — ESLM Documentation`;
          await this.renderSpecNavigation();
          this.scrollToHash();
        } catch (error) {
          this.showError(error.message);
        }
      }

      renderMetadata(metadata) {
        if (!metadata || Object.keys(metadata).length === 0) {
          this.specMeta.innerHTML = '';
          return;
        }

        const items = [];
        if (metadata.id) {
          items.push(this.renderMetaItem('Identifier', `<code>${this.escapeHtml(metadata.id)}</code>`));
        }
        if (metadata.status) {
          items.push(
            this.renderMetaItem(
              'Status',
              `${this.renderStatus(metadata.status)}<span class="spec-status-context">${this.escapeHtml(this.statusContext(metadata.status))}</span>`
            )
          );
        }
        if (metadata.owner) {
          items.push(this.renderMetaItem('Owner', this.escapeHtml(metadata.owner)));
        }
        if (metadata.summary) {
          items.push(this.renderMetaItem('Summary', this.escapeHtml(metadata.summary)));
        }

        this.specMeta.innerHTML = items.length
          ? `<section class="spec-meta"><div class="spec-meta__grid">${items.join('')}</div></section>`
          : '';
      }

      renderMetaItem(label, value) {
        return `<dl class="spec-meta__item"><dt>${label}</dt><dd>${value}</dd></dl>`;
      }

      normalizeStatus(status) {
        return String(status).trim().toLowerCase().replace(/\s+/g, '-');
      }

      statusContext(status) {
        const descriptions = {
          implemented: 'The frontmatter marks this contract as implemented. Its stated limits and acceptance evidence still apply.',
          'in-progress': 'This contract is authoritative direction, but not every requirement is implemented. Read its current-state and acceptance passages before inferring support.',
          planned: 'This is a design target, not a claim about current runtime behavior.',
          draft: 'This text is still being shaped and must not be treated as a settled implementation contract.',
          'review-needed': 'This contract remains active but has an explicit review requirement.',
          deprecated: 'This contract is retained for context and should not guide new implementation.',
        };
        return descriptions[this.normalizeStatus(status)] ?? 'Read the specification text and linked evidence to determine implementation support.';
      }

      removeLeadingHeading(markdown) {
        const lines = markdown.split('\n');
        const firstContent = lines.findIndex((line) => line.trim().length > 0);
        if (firstContent >= 0 && /^#\s+/u.test(lines[firstContent].trim())) {
          lines.splice(firstContent, 1);
        }
        return lines.join('\n');
      }

      headingLabel(markdown) {
        return String(markdown)
          .replace(/`([^`]+)`/g, '$1')
          .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
          .replace(/[\*_]/g, '')
          .trim();
      }

      headingId(label, usedIds) {
        const base = label.toLowerCase()
          .normalize('NFKD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-|-$/g, '') || 'section';
        const seen = usedIds.get(base) ?? 0;
        usedIds.set(base, seen + 1);
        return seen === 0 ? base : `${base}-${seen + 1}`;
      }

      renderTableOfContents(headings) {
        this.specTocList.replaceChildren();
        const visibleHeadings = headings.filter(({ level }) => level >= 2 && level <= 3);
        if (visibleHeadings.length === 0) {
          this.specToc.hidden = true;
          return;
        }
        for (const heading of visibleHeadings) {
          const item = document.createElement('li');
          item.className = `spec-toc__level-${heading.level}`;
          const link = document.createElement('a');
          link.href = `#${heading.id}`;
          link.textContent = heading.label;
          item.append(link);
          this.specTocList.append(item);
        }
        this.specToc.hidden = false;
      }

      async renderSpecNavigation() {
        this.specNavigation.replaceChildren();
        this.specNavigation.hidden = true;
        if (!this.specPath.startsWith('DS')) return;

        try {
          const response = await fetch('specs/matrix.md');
          if (!response.ok) return;
          const matrix = await response.text();
          const pattern = /^\|\s*\[([^\]]+)\]\(specsLoader\.html\?spec=([^)]+)\)\s*\|\s*([^|]+?)\s*\|/gmu;
          const entries = [...matrix.matchAll(pattern)].map((match) => ({
            id: match[1].trim(),
            file: decodeURIComponent(match[2].trim()),
            title: match[3].trim(),
          }));
          const current = entries.findIndex(({ file }) => file === this.specPath);
          if (current < 0) return;
          if (current > 0) this.specNavigation.append(this.specNavigationLink(entries[current - 1], 'Previous'));
          if (current < entries.length - 1) this.specNavigation.append(this.specNavigationLink(entries[current + 1], 'Next'));
          this.specNavigation.hidden = this.specNavigation.childElementCount === 0;
        } catch {
          this.specNavigation.hidden = true;
        }
      }

      specNavigationLink(entry, direction) {
        const link = document.createElement('a');
        link.className = `spec-navigation__${direction.toLowerCase()}`;
        link.href = `specsLoader.html?spec=${encodeURIComponent(entry.file)}`;
        const directionLabel = document.createElement('span');
        directionLabel.className = 'spec-navigation__direction';
        directionLabel.textContent = direction;
        const title = document.createElement('span');
        title.className = 'spec-navigation__title';
        title.textContent = `${entry.id} — ${entry.title}`;
        link.append(directionLabel, title);
        return link;
      }

      scrollToHash() {
        const hash = decodeURIComponent(window.location.hash.slice(1));
        if (!hash) return;
        const target = document.getElementById(hash);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }

      showError(message) {
        this.specMeta.innerHTML = '';
        this.specToc.hidden = true;
        this.specNavigation.hidden = true;
        this.content.innerHTML = `
          <div class="error-panel">
            <h3>Error Loading Specification</h3>
            <p>${this.escapeHtml(message)}</p>
            <p><a href="specsLoader.html?spec=matrix.md">Return to Specification Matrix</a></p>
          </div>
        `;
        this.currentSpecSpan.textContent = 'Error';
      }

      escapeHtml(text) {
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      renderStatus(status) {
        const normalized = this.normalizeStatus(status);
        const labels = {
          implemented: 'Implemented',
          'in-progress': 'In progress',
          planned: 'Planned',
          draft: 'Draft',
          'review-needed': 'Review needed',
          deprecated: 'Deprecated',
          unknown: 'Unknown'
        };
        const label = labels[normalized] || status;
        return `<span class="spec-status spec-status--${normalized}">${this.escapeHtml(label)}</span>`;
      }

      applyInline(text) {
        const codeStore = [];
        const withPlaceholders = text.replace(/`([^`]+)`/g, (_, code) => {
          codeStore.push(code);
          return `@@CODE_PLACEHOLDER_${codeStore.length - 1}@@`;
        });

        let escaped = this.escapeHtml(withPlaceholders)
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>')
          .replace(/(^|[\s(])_(.+?)_(?=[\s).]|$)/g, '$1<em>$2</em>')
          .replace(/\[\[(status):([a-z-]+)\]\]/gi, (_, __, value) => this.renderStatus(value))
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

        escaped = escaped.replace(/@@CODE_PLACEHOLDER_(\d+)@@/g, (_, idx) =>
          `<code>${this.escapeHtml(codeStore[idx])}</code>`
        );

        return escaped;
      }

      tableCells(line) {
        const source = line.trim().slice(1, -1);
        const cells = [];
        let cell = '';
        for (let index = 0; index < source.length; index += 1) {
          const character = source[index];
          if (character === '\\' && source[index + 1] === '|') {
            cell += '|';
            index += 1;
          } else if (character === '|') {
            cells.push(cell.trim());
            cell = '';
          } else {
            cell += character;
          }
        }
        cells.push(cell.trim());
        return cells;
      }

      tableCellLabel(markdown, fallback) {
        return this.headingLabel(markdown) || fallback;
      }

      tableClass(headers, rows) {
        const primaryLabels = rows.map((row) => this.tableCellLabel(row[0] ?? '', ''));
        const primaryHeader = this.tableCellLabel(headers[0] ?? '', '');
        const compactPrimary = primaryHeader.length <= 28 && primaryLabels.length > 0
          && primaryLabels.every((label) => label.length <= 28 && !/[.!?]/u.test(label));
        const classes = ['spec-table'];
        if (compactPrimary) classes.push('table--compact-key');
        if (this.specPath === 'matrix.md') classes.push('spec-table--matrix');
        return classes.join(' ');
      }

      tableDetails(headers, row) {
        const details = headers.slice(1).map((header, index) => {
          const value = row[index + 1] ?? '';
          return `<div><dt>${this.applyInline(header)}</dt><dd>${this.applyInline(value)}</dd></div>`;
        });
        for (let index = headers.length; index < row.length; index += 1) {
          details.push(
            `<div><dt>Additional detail</dt><dd>${this.applyInline(row[index])}</dd></div>`
          );
        }
        return `<dl class="spec-table__details">${details.join('')}</dl>`;
      }

      parseTable(startIndex, lines) {
        const headerLine = lines[startIndex];
        const dividerLine = lines[startIndex + 1];
        const rowPattern = /^\s*\|(.+)\|\s*$/;
        const dividerPattern = /^\s*\|?[\s:|\-]+\|?\s*$/;

        if (!rowPattern.test(headerLine) || !dividerLine || !dividerPattern.test(dividerLine)) {
          return null;
        }

        const headers = this.tableCells(headerLine);
        const rows = [];
        let cursor = startIndex + 2;

        while (cursor < lines.length && rowPattern.test(lines[cursor])) {
          rows.push(this.tableCells(lines[cursor]));
          cursor += 1;
        }

        const primaryHeader = headers[0] ?? 'Item';
        const primaryLabel = this.tableCellLabel(primaryHeader, 'Item');
        const detailsHeader = headers.length === 2 ? headers[1] : 'Details';
        const detailsLabel = this.tableCellLabel(detailsHeader, 'Details');
        const thead = '<thead><tr>'
          + `<th scope="col">${this.applyInline(primaryHeader)}</th>`
          + `<th scope="col">${this.applyInline(detailsHeader)}</th>`
          + '</tr></thead>';
        const tbody = rows.map((row) => {
          const primaryValue = this.applyInline(row[0] ?? '');
          const detailsValue = headers.length === 2
            ? this.applyInline(row[1] ?? '')
            : this.tableDetails(headers, row);
          return '<tr>'
            + `<td data-label="${this.escapeHtml(primaryLabel)}">${primaryValue}</td>`
            + `<td data-label="${this.escapeHtml(detailsLabel)}">${detailsValue}</td>`
            + '</tr>';
        }).join('');

        const tableClass = this.tableClass(headers, rows);
        return {
          html: `<div class="table-wrap"><table class="${tableClass}">${thead}<tbody>${tbody}</tbody></table></div>`,
          nextIndex: cursor - 1
        };
      }

      markdownToHtml(markdown) {
        const lines = markdown.split('\n');
        const htmlParts = [];
        const headings = [];
        const usedHeadingIds = new Map();
        let paragraph = [];
        let listItems = [];
        let listKind = null;
        let listStart = 1;
        let inCode = false;
        let codeBuffer = [];

        const flushParagraph = () => {
          if (!paragraph.length) return;
          htmlParts.push(`<p>${this.applyInline(paragraph.map((line) => line.trim()).join(' '))}</p>`);
          paragraph = [];
        };

        const flushList = () => {
          if (!listItems.length) return;
          const start = listKind === 'ol' && listStart !== 1 ? ` start="${listStart}"` : '';
          htmlParts.push(`<${listKind}${start}>${listItems.map((item) => `<li>${item}</li>`).join('')}</${listKind}>`);
          listItems = [];
          listKind = null;
          listStart = 1;
        };

        const appendListItem = (kind, item, start = 1) => {
          if (listKind && listKind !== kind) flushList();
          if (!listKind) {
            listKind = kind;
            listStart = start;
          }
          listItems.push(item);
        };

        const flushCode = () => {
          if (!codeBuffer.length) return;
          htmlParts.push(`<pre><code>${this.escapeHtml(codeBuffer.join('\n'))}</code></pre>`);
          codeBuffer = [];
        };

        for (let index = 0; index < lines.length; index += 1) {
          const rawLine = lines[index];
          const line = rawLine.trimEnd();
          const trimmed = line.trim();

          if (trimmed.startsWith('```')) {
            if (inCode) {
              flushCode();
              inCode = false;
            } else {
              flushParagraph();
              flushList();
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeBuffer.push(rawLine);
            continue;
          }

          if (!trimmed) {
            flushParagraph();
            flushList();
            continue;
          }

          if (trimmed.startsWith('|') && trimmed.endsWith('|') && index + 1 < lines.length) {
            const table = this.parseTable(index, lines);
            if (table) {
              flushParagraph();
              flushList();
              htmlParts.push(table.html);
              index = table.nextIndex;
              continue;
            }
          }

          const headingMatch = trimmed.match(/^(#{1,4})\s+(.+)$/);
          if (headingMatch) {
            flushParagraph();
            flushList();
            const level = headingMatch[1].length;
            const label = this.headingLabel(headingMatch[2]);
            const id = this.headingId(label, usedHeadingIds);
            const text = this.applyInline(headingMatch[2]);
            htmlParts.push(`<h${level} id="${id}">${text}</h${level}>`);
            headings.push({ level, id, label });
            continue;
          }

          const numberedMatch = trimmed.match(/^(\d+)\.\s+(.+)/);
          if (numberedMatch) {
            flushParagraph();
            appendListItem('ol', this.applyInline(numberedMatch[2]), Number(numberedMatch[1]));
            continue;
          }

          const bulletMatch = trimmed.match(/^-\s+(.+)/);
          if (bulletMatch) {
            flushParagraph();
            appendListItem('ul', this.applyInline(bulletMatch[1]));
            continue;
          }

          if (listItems.length > 0 && /^\s{2,}\S/u.test(rawLine)) {
            listItems[listItems.length - 1] += ` ${this.applyInline(trimmed)}`;
            continue;
          }

          flushList();
          paragraph.push(line);
        }

        flushCode();
        flushList();
        flushParagraph();
        return { html: htmlParts.join('\n'), headings };
      }
    }

    document.addEventListener('DOMContentLoaded', () => new SpecsLoader());
  </script>
  <script src="partials-loader.js"></script>
</body>
</html>
