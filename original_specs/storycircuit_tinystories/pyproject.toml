[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storycircuit"
version = "0.1.0"
description = "Reference kernel and research kit for an executable symbolic language model trained on TinyStories"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Axiologic Research"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4", "PyYAML>=6"]
neural = ["torch>=2", "transformers>=4.45", "datasets>=3", "accelerate>=1"]
analysis = ["numpy>=1.26", "pandas>=2"]

[project.scripts]
storycircuit = "storycircuit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
